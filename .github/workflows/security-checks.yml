name: Android security regression checks

on:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/security-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-checks-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:processReleaseMainManifest --no-daemon --stacktrace
