name: Tu voz · Android y reglas Spark
on:
  push:
    branches: ["feat/tu-voz-produccion"]
  pull_request:
    paths:
      - "app/**"
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - ".github/workflows/tu-voz-ci.yml"
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar Kotlin de Android
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon
  spark-firestore-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias de reglas Firebase
        run: |
          npm ci --prefix tools/firestore-tests
          npm install --global firebase-tools
          node --check functions/moderate-voice.cjs
      - name: Probar reglas reales en emulador Firestore
        run: |
          firebase emulators:exec --project demo-lumi-bonds --only firestore \
            "cd tools/firestore-tests && node --test voice_rules.test.cjs"
