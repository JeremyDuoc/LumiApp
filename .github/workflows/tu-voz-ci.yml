name: Tu voz · Android y reglas
on:
  push:
    branches: ["feat/tu-voz-produccion"]
  pull_request:
    paths:
      - "app/**"
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - ".github/workflows/tu-voz-ci.yml"
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar Kotlin de Android
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon
  voice-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar funciones y validar backend
        run: |
          npm ci --prefix functions
          node --check functions/index.js
          node --check functions/voice.js
          node --check functions/moderate-voice.cjs
          node --test functions/voice.test.cjs
