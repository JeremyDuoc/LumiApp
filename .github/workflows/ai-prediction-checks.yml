name: Lumi predictive model regression checks

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/ai-prediction-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumi-ai-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prediction-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build and unit-test both variants
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebugAndroidTest :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
